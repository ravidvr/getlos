name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (scraper parsers, retry logic, no-wipe guarantees)
        run: npm test
      - name: Dashboard JS syntax check
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys
          html = open("dashboard.html", encoding="utf-8").read()
          js = "\n".join(re.findall(r"<script[^>]*>(.*?)</script>", html, re.DOTALL))
          open("/tmp/check.js", "w", encoding="utf-8").write(js)
          r = subprocess.run(["node", "--check", "/tmp/check.js"], capture_output=True, text=True)
          print(r.stdout or r.stderr)
          sys.exit(r.returncode)
          EOF
